[project]
name = "booksync"
version = "0.1.0"
description = "Pull your Google Play Books uploads into Apple Books on macOS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=50.0.2",
    "pillow>=13.0.0",
    "playwright>=1.48",
]

[project.scripts]
booksync = "booksync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booksync"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
