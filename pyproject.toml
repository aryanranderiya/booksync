[project]
name = "booksync"
version = "0.1.0"
description = "Move your Google Play Books uploads into Apple Books on macOS"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Aryan Randeriya" }]
keywords = [
  "google-play-books",
  "apple-books",
  "ebooks",
  "epub",
  "macos",
  "cli",
  "automation",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["playwright>=1.48", "pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/aryanranderiya/booksync"
Issues = "https://github.com/aryanranderiya/booksync/issues"

[project.scripts]
booksync = "booksync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booksync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
